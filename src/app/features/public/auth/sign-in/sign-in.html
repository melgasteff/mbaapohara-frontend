<section class="page auth" aria-labelledby="titulo">
  <h1 id="titulo" class="h1">Ingresar</h1>
  @if (volver() === '/publicar') {
    <p class="body">Ingresá para escribir tu reseña.</p>
  }
  <p class="mb-help anon"><svg lucideLock [size]="16" aria-hidden="true"></svg>Tu nombre nunca se muestra en las reseñas.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as message) {
      <p class="alert body-sm" role="alert"><svg lucideCircleAlert [size]="16" aria-hidden="true"></svg>{{ message }}</p>
    }

    <div class="mb-field" [class.mb-field-error]="show('email')">
      <label for="email">Correo</label>
      <input
        id="email"
        class="mb-input"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="show('email')"
        [attr.aria-describedby]="show('email') ? 'email-error' : null"
      />
      @if (show('email')) {
        <span class="mb-help" id="email-error"><svg lucideCircleAlert [size]="16" aria-hidden="true"></svg>Escribí un correo válido.</span>
      }
    </div>

    <div class="mb-field" [class.mb-field-error]="show('password')">
      <label for="password">Contraseña</label>
      <input
        id="password"
        class="mb-input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="show('password')"
        [attr.aria-describedby]="show('password') ? 'password-error' : null"
      />
      @if (show('password')) {
        <span class="mb-help" id="password-error"><svg lucideCircleAlert [size]="16" aria-hidden="true"></svg>Escribí tu contraseña.</span>
      }
    </div>

    <button type="submit" class="mb-btn mb-btn-primary" [disabled]="sending()">
      {{ sending() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <p class="body-sm switch">
    ¿No tenés cuenta?
    <a class="mb-link" routerLink="/registro" [queryParams]="volver() ? { volver: volver() } : {}">Creá una</a>
  </p>
</section>
