<header class="mb-header site-header">
  <a class="site-header__brand" routerLink="/" aria-label="Mbaapohara, inicio" (click)="closeMenu()">
    <app-logo />
  </a>

  <form class="site-header__search" role="search" (submit)="search($event, term.value)">
    <label class="mb-search">
      <svg lucideSearch [size]="20"></svg>
      <span class="visually-hidden">Buscar empresas</span>
      <input #term type="search" name="q" placeholder="Buscá una empresa" autocomplete="off" />
    </label>
  </form>

  <button
    type="button"
    class="mb-btn mb-btn-ghost site-header__toggle"
    aria-controls="menu-principal"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    @if (menuOpen()) {
      <svg lucideX [size]="20"></svg>
    } @else {
      <svg lucideMenu [size]="20"></svg>
    }
    Menú
  </button>

  <nav id="menu-principal" class="mb-nav site-header__nav" [class.is-open]="menuOpen()" aria-label="Principal">
    <a routerLink="/empresas" routerLinkActive ariaCurrentWhenActive="page" (click)="closeMenu()">Empresas</a>
    @if (session.isAdmin()) {
      <a routerLink="/admin" routerLinkActive ariaCurrentWhenActive="page" (click)="closeMenu()">Administración</a>
    }
    @if (session.isAuthenticated()) {
      <a routerLink="/mis-resenas" routerLinkActive ariaCurrentWhenActive="page" (click)="closeMenu()">Mis reseñas</a>
      <a routerLink="/mi-cuenta" routerLinkActive ariaCurrentWhenActive="page" (click)="closeMenu()">Mi cuenta</a>
      <button type="button" class="site-header__logout" (click)="signOut()">Salir</button>
    } @else {
      <a routerLink="/ingresar" routerLinkActive ariaCurrentWhenActive="page" (click)="closeMenu()">Ingresar</a>
    }
    <a class="mb-btn mb-btn-primary mb-btn-sm" routerLink="/publicar" (click)="closeMenu()">Escribí tu reseña</a>
  </nav>
</header>
