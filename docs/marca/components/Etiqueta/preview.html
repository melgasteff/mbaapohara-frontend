<!-- @dsCard group="Estados" height=130 subtitle="Etiquetas de estado y chips de filtro" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Etiqueta — vista previa</title></head>
<body>
<div class="mb-stage mb-col">
  <div class="mb-row">
    <span class="mb-tag mb-tag-success"><svg class="mb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Empleo verificado</span>
    <span class="mb-tag mb-tag-yerba"><svg class="mb-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Anónima</span>
    <span class="mb-tag mb-tag-warning"><svg class="mb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>En revisión</span>
    <span class="mb-tag mb-tag-tierra">Nueva</span>
    <span class="mb-tag mb-tag-danger"><svg class="mb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>Rechazada</span>
    <span class="mb-tag">Comercio</span>
  </div>
  <div class="mb-row">
    <button class="mb-chip" aria-pressed="true">Asunción</button>
    <button class="mb-chip" aria-pressed="false">Central</button>
    <button class="mb-chip" aria-pressed="false">Alto Paraná</button>
    <button class="mb-chip" aria-pressed="false">4 estrellas o más</button>
  </div>
</div>
</body>
</html>
